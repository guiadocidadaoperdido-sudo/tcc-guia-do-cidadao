# Integração contínua: a cada push ou pull request na main, o GitHub roda os
# testes no SQLite e no PostgreSQL (o mesmo banco usado no Render/Neon).
name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        banco: [sqlite, postgres]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guia_testes
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        env:
          TEST_DATABASE_URL: ${{ matrix.banco == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/guia_testes' || '' }}
        run: python -m pytest -v

      - name: Conferir as migrações no PostgreSQL
        if: matrix.banco == 'postgres'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guia_testes
        run: |
          flask --app run criar-banco
          flask --app run dados-iniciais
          flask --app run db downgrade base
